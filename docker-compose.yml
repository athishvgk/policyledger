services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: policyledger
      POSTGRES_PASSWORD: policyledger
      POSTGRES_DB: policyledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://policyledger:policyledger@postgres:5432/policyledger
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
