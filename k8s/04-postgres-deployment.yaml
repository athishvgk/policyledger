apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: policyledger
spec:
  replicas: 1 # a single Postgres writer; this isn't a clustered database
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the postgres image's built-in "postgres" user
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault # blocks syscalls a normal app never needs; found missing by `trivy config` (KSV-0104)
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Postgres itself never writes outside PGDATA and its unix
            # socket dir -- both mounted separately below -- so the rest of
            # the container's filesystem can be locked read-only, same as
            # the api container in 06-api-deployment.yaml.
            readOnlyRootFilesystem: true
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: policyledger-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: policyledger-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: policyledger-secret
                  key: POSTGRES_PASSWORD
            # A subdirectory, not the volume root: avoids postgres refusing
            # to start if the mounted volume's top level isn't empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql # unix socket lives here; needs to be writable
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "policyledger"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "policyledger"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
