apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyledger-api
  namespace: policyledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policyledger-api
  template:
    metadata:
      labels:
        app: policyledger-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # matches the "appuser" the Dockerfile creates
        seccompProfile:
          type: RuntimeDefault # blocks syscalls a normal app never needs; found missing by `trivy config` (KSV-0104)
      # Kubernetes has no docker-compose-style `depends_on: condition:
      # service_healthy`. Without this, the api pods start racing postgres
      # on every fresh deploy, fail their first connection, and crash once
      # before Kubernetes restarts them into a working state -- annoying
      # noise, not a real outage, but worth blocking on properly instead of
      # shipping a container that's expected to crash on its first try.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U policyledger; do echo waiting for postgres; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # only runs pg_isready in a loop; never writes a file
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api
          # Built locally and loaded straight into kind's node with
          # `kind load docker-image` -- no registry involved yet (that's
          # Day 3, pushing to GHCR). imagePullPolicy: Never makes that
          # explicit: if this image isn't already on the node, the pod
          # should fail loudly instead of silently trying the network.
          image: policyledger-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: policyledger-secret
                  key: DATABASE_URL
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
