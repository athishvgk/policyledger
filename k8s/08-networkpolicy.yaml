# VERIFIED ENFORCED on this cluster (kind v0.33.0 / kindnet). This used to
# be a known gap -- older kindnet versions silently ignored NetworkPolicy --
# but kindnet gained real enforcement, and it was confirmed here by hand:
# an unlabeled pod's connection to postgres:5432 timed out, while a pod
# labeled app=policyledger-api reached it. See README's Honesty notes for
# the exact commands and the kindnet version this was true on -- don't
# assume it holds on an older kind install.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
  namespace: policyledger
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: policyledger-api
      ports:
        - protocol: TCP
          port: 5432
