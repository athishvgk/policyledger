# Azure-only. Pulls the database credentials out of Azure Key Vault and
# exposes them as the same Kubernetes Secret (policyledger-secret) that the
# api and postgres Deployments already reference, so those two files are not
# touched at all.
#
# __KEY_VAULT_NAME__, __TENANT_ID__ and __CSI_CLIENT_ID__ are filled in by
# scripts/deploy-azure.sh from `terraform output`.
#
# How it works: the secrets-store CSI add-on only creates the Kubernetes
# Secret while at least one pod has the volume below mounted. The
# secret-sync pod is that pod; it does nothing else.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: policyledger-keyvault
  namespace: policyledger
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__CSI_CLIENT_ID__"
    keyvaultName: "__KEY_VAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
          objectAlias: POSTGRES_PASSWORD
        - |
          objectName: database-url
          objectType: secret
          objectAlias: DATABASE_URL
  secretObjects:
    - secretName: policyledger-secret
      type: Opaque
      data:
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: DATABASE_URL
          key: DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync
  namespace: policyledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-sync
  template:
    metadata:
      labels:
        app: secret-sync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          # Does nothing; exists only to hold the volume mount open.
          image: registry.k8s.io/pause:3.10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: keyvault
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: policyledger-keyvault
